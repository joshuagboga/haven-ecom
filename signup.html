<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create your haven. account." />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Create account — haven.</title>
    <script src="js/auth.js" defer></script>
    <script src="js/signup.js" defer></script>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-[#f7f6f2] text-[#172019]">
      <header class="mx-auto flex h-20 w-full max-w-7xl items-center justify-between px-5 sm:px-8">
        <a href="index.html" class="flex items-center gap-3" aria-label="Haven home">
          <span class="grid h-9 w-9 place-items-center rounded-full bg-[#1d4d35] text-sm font-bold text-white">H</span>
          <span class="text-xl font-bold tracking-[-0.04em]">haven.</span>
        </a>
        <a href="index.html" class="text-sm font-semibold transition-colors hover:text-[#d75f36]">Back to shop</a>
      </header>

      <main class="grid flex-1 place-items-center px-5 py-12 sm:px-8">
        <div class="w-full max-w-md rounded-[2rem] bg-white p-8 shadow-sm sm:p-10">
          <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-[#d75f36]">Join haven.</p>
          <h1 class="text-4xl font-bold tracking-[-0.045em]">Create account.</h1>
          <p class="mt-3 text-sm leading-6 text-black/50">Save your details and keep track of your orders.</p>

          <form id="signup-form" class="mt-8 space-y-5" novalidate>
            <div class="grid gap-5 sm:grid-cols-2">
              <label class="block">
                <span class="mb-2 block text-sm font-semibold">First name</span>
                <input
                  name="firstName"
                  type="text"
                  autocomplete="given-name"
                  required
                  class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
                />
              </label>
              <label class="block">
                <span class="mb-2 block text-sm font-semibold">Last name</span>
                <input
                  name="lastName"
                  type="text"
                  autocomplete="family-name"
                  required
                  class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
                />
              </label>
            </div>
            <label class="block">
              <span class="mb-2 block text-sm font-semibold">Email</span>
              <input
                name="email"
                type="email"
                autocomplete="email"
                required
                class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
              />
            </label>
            <label class="block">
              <span class="mb-2 block text-sm font-semibold">Username</span>
              <input
                name="username"
                type="text"
                autocomplete="username"
                required
                class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
              />
            </label>
            <label class="block">
              <span class="mb-2 block text-sm font-semibold">Password</span>
              <input
                name="password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                required
                class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
              />
              <span class="mt-2 block text-xs text-black/40">At least 6 characters.</span>
            </label>

            <p id="signup-error" role="alert" class="hidden rounded-2xl bg-[#d75f36]/10 px-4 py-3 text-sm font-semibold text-[#9b3e20]"></p>

            <button
              id="signup-submit"
              type="submit"
              class="w-full rounded-full bg-[#1d4d35] py-4 text-sm font-bold text-white transition hover:bg-[#d75f36] disabled:cursor-wait disabled:opacity-60"
            >
              Create account
            </button>
          </form>

          <p class="mt-8 text-center text-sm text-black/55">
            Already have an account?
            <a href="login.html" class="font-bold text-[#1d4d35] underline decoration-[#1d4d35]/25 underline-offset-4">Sign in</a>
          </p>
        </div>
      </main>

      <footer class="px-5 py-8 text-center text-xs text-black/35 sm:px-8">
        Accounts powered by DummyJSON — new accounts are simulated and saved only in this browser.
      </footer>
    </div>
  </body>
</html>
