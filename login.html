<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your haven. account." />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Sign in — haven.</title>
    <script src="js/auth.js" defer></script>
    <script src="js/login.js" defer></script>
  </head>
  <body>
    <div class="flex min-h-screen flex-col bg-[#f7f6f2] text-[#172019]">
      <header class="mx-auto flex h-20 w-full max-w-7xl items-center justify-between px-5 sm:px-8">
        <a href="index.html" class="flex items-center gap-3" aria-label="Haven home">
          <span class="grid h-9 w-9 place-items-center rounded-full bg-[#1d4d35] text-sm font-bold text-white">H</span>
          <span class="text-xl font-bold tracking-[-0.04em]">haven.</span>
        </a>
        <a href="index.html" class="text-sm font-semibold transition-colors hover:text-[#d75f36]">Back to shop</a>
      </header>

      <main class="grid flex-1 place-items-center px-5 py-12 sm:px-8">
        <div class="w-full max-w-md rounded-[2rem] bg-white p-8 shadow-sm sm:p-10">
          <p class="mb-3 text-xs font-bold uppercase tracking-[0.2em] text-[#d75f36]">Welcome back</p>
          <h1 class="text-4xl font-bold tracking-[-0.045em]">Sign in.</h1>
          <p class="mt-3 text-sm leading-6 text-black/50">Track your orders and manage your account.</p>

          <form id="login-form" class="mt-8 space-y-5" novalidate>
            <label class="block">
              <span class="mb-2 block text-sm font-semibold">Username</span>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
              />
            </label>
            <label class="block">
              <span class="mb-2 block text-sm font-semibold">Password</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                class="h-12 w-full rounded-full border border-black/15 bg-[#f7f6f2] px-5 text-sm outline-none transition focus:border-[#1d4d35]"
              />
            </label>

            <p id="login-error" role="alert" class="hidden rounded-2xl bg-[#d75f36]/10 px-4 py-3 text-sm font-semibold text-[#9b3e20]"></p>

            <button
              id="login-submit"
              type="submit"
              class="w-full rounded-full bg-[#1d4d35] py-4 text-sm font-bold text-white transition hover:bg-[#d75f36] disabled:cursor-wait disabled:opacity-60"
            >
              Sign in
            </button>
          </form>

          <div class="mt-8 rounded-2xl border border-dashed border-black/15 p-4 text-sm text-black/55">
            <p>
              Demo account: <span class="font-semibold text-[#172019]">emilys</span> /
              <span class="font-semibold text-[#172019]">emilyspass</span>
            </p>
            <button type="button" id="demo-fill" class="mt-2 font-bold text-[#1d4d35] underline decoration-[#1d4d35]/25 underline-offset-4">
              Use demo account
            </button>
          </div>

          <p class="mt-6 text-center text-sm text-black/55">
            New to haven.?
            <a href="signup.html" class="font-bold text-[#1d4d35] underline decoration-[#1d4d35]/25 underline-offset-4">Create an account</a>
          </p>
        </div>
      </main>

      <footer class="px-5 py-8 text-center text-xs text-black/35 sm:px-8">Accounts powered by DummyJSON</footer>
    </div>
  </body>
</html>
