<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your haven. account and orders." />
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Your account — haven.</title>
    <script src="js/auth.js" defer></script>
    <script src="js/dashboard.js" defer></script>
  </head>
  <body>
    <div class="min-h-screen bg-[#f7f6f2] text-[#172019]">
      <header class="sticky top-0 z-30 border-b border-black/8 bg-[#f7f6f2]/90 backdrop-blur-xl">
        <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-5 sm:px-8">
          <a href="index.html" class="flex items-center gap-3" aria-label="Haven home">
            <span class="grid h-9 w-9 place-items-center rounded-full bg-[#1d4d35] text-sm font-bold text-white">H</span>
            <span class="text-xl font-bold tracking-[-0.04em]">haven.</span>
          </a>
          <div class="flex items-center gap-3">
            <a href="index.html" class="hidden text-sm font-semibold transition-colors hover:text-[#d75f36] sm:block">Back to shop</a>
            <button
              type="button"
              id="logout"
              class="rounded-full border border-black/15 px-4 py-2.5 text-sm font-semibold transition hover:border-[#1d4d35] hover:bg-white"
            >
              Sign out
            </button>
          </div>
        </div>
      </header>

      <main id="dashboard" class="mx-auto max-w-7xl px-5 pb-20 pt-12 sm:px-8 sm:pt-16"></main>

      <footer class="bg-[#172019] px-5 py-10 text-white sm:px-8">
        <div class="mx-auto flex max-w-7xl flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <p class="text-2xl font-bold tracking-[-0.04em]">haven.</p>
          <p class="text-xs text-white/35">Accounts and orders powered by DummyJSON</p>
        </div>
      </footer>
    </div>
  </body>
</html>
